<article class="user-card">
  <div class="card-topline">
    <span class="profile-number">02</span>
    <span class="status-dot">Available</span>
  </div>
  <div class="avatar" data-tone="1">JS</div>
  <div class="user-copy">
    <h2>{{ user.name }}</h2>
    <p>{{ user.email }}</p>
  </div>
  <div class="user-meta">
    <span>{{ user.city }}</span>
    <span>{{ user.age }}years &middot; {{ user.gender }}</span>
  </div>
  <button type="button" class="profile-link" aria-label="View Jane Smith profile">
    View profile <span aria-hidden="true">&rarr;</span>
  </button>
</article>
